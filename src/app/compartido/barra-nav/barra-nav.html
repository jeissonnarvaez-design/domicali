<header class="barra">
  <a class="logo" routerLink="/inicio">Domi<span>Cali</span></a>

  <nav class="menu">
    <!-- menu publico: lo ve cualquiera -->
    <a routerLink="/inicio" routerLinkActive="activo">Inicio</a>
    <a routerLink="/restaurantes" routerLinkActive="activo">Restaurantes</a>
    <a routerLink="/buscar" routerLinkActive="activo">Buscar</a>

    <!-- menu privado: solo con sesion iniciada -->
    @if (auth.session()) {
      <a routerLink="/carrito" routerLinkActive="activo">
        Carrito
        @if (carrito.cantidad() > 0) {
          <span class="contador">{{ carrito.cantidad() }}</span>
        }
      </a>
      <a routerLink="/pedidos" routerLinkActive="activo">Mis pedidos</a>
      <a routerLink="/cocina" routerLinkActive="activo">Cocina</a>
      <a routerLink="/perfil" routerLinkActive="activo">Perfil</a>
    }
  </nav>

  <div class="cuenta">
    @if (auth.session()) {
      <span class="correo">{{ auth.correo() }}</span>
      <button type="button" class="boton-borde" (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/login">Entrar</a>
      <a class="boton" routerLink="/registro">Crear cuenta</a>
    }
  </div>
</header>

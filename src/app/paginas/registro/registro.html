<div class="tarjeta-form">
  <h2>Crear cuenta</h2>

  <form (ngSubmit)="registrar()">
    <label for="email">Correo</label>
    <input id="email" type="email" name="email" [(ngModel)]="email" required />

    <label for="clave">Contrasena</label>
    <input id="clave" type="password" name="clave" [(ngModel)]="clave" required />

    <label for="repetir">Repetir contrasena</label>
    <input id="repetir" type="password" name="repetir" [(ngModel)]="repetir" required />

    @if (msg) {
      <p class="error">{{ msg }}</p>
    }

    <button type="submit" class="boton">Registrarme</button>
  </form>

  <p class="pie">Ya tienes cuenta? <a routerLink="/login">Entra</a></p>
</div>
